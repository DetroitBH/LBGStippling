name: Build Midea Comfort APK

on:
  push:
    branches: [ midea-comfort-build ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Restore Midea Comfort source
        shell: bash
        run: |
          cat midea_payload/part*.b64 | base64 --decode > /tmp/midea-source.zip
          echo "3204239fd494f1365bfd0454067a3dbcca31cd971e80640fbda2aa66a2dcee73  /tmp/midea-source.zip" | sha256sum --check
          mkdir -p /tmp/midea-build
          unzip -q /tmp/midea-source.zip -d /tmp/midea-build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Build debug APK
        working-directory: /tmp/midea-build
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MideaComfort-debug-apk
          path: /tmp/midea-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
